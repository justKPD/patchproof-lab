name: Engineering checks
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --target .compiler ziglang==0.14.1
      - run: python tools/build.py
        env:
          ZIG_EXE: ${{ github.workspace }}/.compiler/ziglang/zig
          CLANG_TIDY: /usr/bin/clang-tidy
      - run: python tools/package_evidence.py
      - run: python tools/evaluate.py
      - run: node --test tests/test_engine.mjs
      # Part 2 (impact lab): needs clang++ with the profile runtime and LLVM coverage tools.
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev
      - run: python -m pip install hypothesis==6.* scikit-learn==1.*
      - run: cp -r impact/results /tmp/committed-results
      - run: python impact/run_all.py
        env:
          CXX_IMPACT: clang++-18
      - run: python -m unittest discover -s tests
        env:
          CXX_IMPACT: clang++-18
      - name: Fresh run reproduces the committed outcomes
        run: python impact/lab/compare_results.py /tmp/committed-results impact/results
